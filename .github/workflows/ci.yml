name: CI

on:
  # Branches are built through their pull request; pushing to main builds the merged result.
  # (Building on every branch push too would run CI twice for each PR, e.g. Dependabot's.)
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Bundle privileged browser allowlist
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL https://www.gstatic.com/gpm-passkeys-privileged-apps/apps.json \
            -o app/src/main/assets/privileged_browsers.json

      - name: Unit tests, lint, debug and (unsigned) release build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
