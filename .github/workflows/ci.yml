name: CI

on:
  # Branches are built through their pull request; pushing to main builds the merged result.
  # (Building on every branch push too would run CI twice for each PR, e.g. Dependabot's.)
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Bundle privileged browser allowlist
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL https://www.gstatic.com/gpm-passkeys-privileged-apps/apps.json \
            -o app/src/main/assets/privileged_browsers.json

      - name: Unit tests, lint, and debug + (unsigned) release builds of both channels
        run: ./gradlew --no-daemon testGithubDebugUnitTest lintGithubDebug lintStoreDebug assembleGithubDebug assembleGithubRelease assembleStoreRelease bundleStoreRelease

      - name: Store build contains no self-update code
        run: |
          scripts/check-store-build.sh \
            app/build/outputs/apk/store/release/*.apk \
            app/build/outputs/bundle/storeRelease/app-store-release.aab \
            --github app/build/outputs/apk/github/release/*.apk

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
