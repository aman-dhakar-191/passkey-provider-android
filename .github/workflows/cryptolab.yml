name: Crypto Lab

# The experimental Crypto Lab app (cryptolab/). Separate from CI so it never holds up Passkey Vault or the demo.
on:
  push:
    branches: [main]
    paths: ["cryptolab/**", "settings.gradle.kts", "gradle/**", ".github/workflows/cryptolab.yml"]
  pull_request:
    paths: ["cryptolab/**", "settings.gradle.kts", "gradle/**", ".github/workflows/cryptolab.yml"]
  workflow_dispatch:

concurrency:
  group: cryptolab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Unit tests, lint and debug build
        run: ./gradlew --no-daemon :cryptolab:testDebugUnitTest :cryptolab:lintDebug :cryptolab:assembleDebug :cryptolab:assembleRelease

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cryptolab-reports
          path: cryptolab/build/reports/
          if-no-files-found: ignore

      # Install the same APK on two phones to try a transfer (debug-signed; for testing only).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cryptolab-debug-apk
          path: cryptolab/build/outputs/apk/debug/*.apk
