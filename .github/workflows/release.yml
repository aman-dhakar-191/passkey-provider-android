name: Release

# Run manually and pick patch / minor / major: the next version is worked out from the latest
# vX.Y.Z tag. Pushing a tag like v1.2.3 also works. Installed apps check the latest release and
# update themselves.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version increase (patch = fixes, minor = new features, major = big changes)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Exact version instead (optional, e.g. 2.0.0)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            V="${INPUT_VERSION#v}"
          else
            LATEST=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST:-0.0.0}"
            case "$BUMP" in
              major) V="$((MAJOR + 1)).0.0" ;;
              minor) V="$MAJOR.$((MINOR + 1)).0" ;;
              *) V="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            esac
            echo "Latest release ${LATEST:-none}, $BUMP bump -> $V"
          fi
          if ! [[ "$V" =~ ^[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Version must look like 1.2.3 (each part 0-99), got '$V'"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
            && git ls-remote --exit-code --tags origin "refs/tags/v$V" > /dev/null; then
            echo "::error::v$V is already released"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. See 'Release signing' in README.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true # signed builds never use a cache an earlier run could have poisoned

      - name: Bundle privileged browser allowlist
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL https://www.gstatic.com/gpm-passkeys-privileged-apps/apps.json \
            -o app/src/main/assets/privileged_browsers.json

      - name: Test and build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew --no-daemon testGithubDebugUnitTest assembleGithubRelease -PappVersionName="$VERSION"

      - name: Verify signature and checksum
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APK="passkey-provider-$VERSION.apk"
          cp app/build/outputs/apk/github/release/app-github-release.apk "$APK"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/apk-signature.txt" \
            || { echo "::error::APK is not signed with APK Signature Scheme v3"; exit 1; }
          sha256sum "$APK" > "$APK.sha256"
          echo "file=$APK" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
