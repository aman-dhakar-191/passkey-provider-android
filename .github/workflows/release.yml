name: Release

# Run manually and pick patch / minor / major: the next version is worked out from the latest
# vX.Y.Z tag. Pushing a tag like v1.2.3 also works. Installed apps check the latest release and
# update themselves.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version increase (patch = fixes, minor = new features, major = big changes)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Exact version instead (optional, e.g. 2.0.0)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            V="${INPUT_VERSION#v}"
          else
            LATEST=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST:-0.0.0}"
            case "$BUMP" in
              major) V="$((MAJOR + 1)).0.0" ;;
              minor) V="$MAJOR.$((MINOR + 1)).0" ;;
              *) V="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            esac
            echo "Latest release ${LATEST:-none}, $BUMP bump -> $V"
          fi
          if ! [[ "$V" =~ ^[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Version must look like 1.2.3 (each part 0-99), got '$V'"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
            && git ls-remote --exit-code --tags origin "refs/tags/v$V" > /dev/null; then
            echo "::error::v$V is already released"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. See 'Release signing' in README.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Bundle privileged browser allowlist
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL https://www.gstatic.com/gpm-passkeys-privileged-apps/apps.json \
            -o app/src/main/assets/privileged_browsers.json

      - name: Test and build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew --no-daemon testGithubDebugUnitTest assembleGithubRelease -PappVersionName="$VERSION"

      - name: Verify signature and checksum
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APK="passkey-provider-$VERSION.apk"
          cp app/build/outputs/apk/github/release/app-github-release.apk "$APK"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "file=$APK" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
