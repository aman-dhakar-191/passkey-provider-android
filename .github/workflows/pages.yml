name: Website

# Builds the GitHub Pages site (landing page, privacy policy, terms of use) from site/, PRIVACY.md and docs/store/.
# PRs only build it (so a broken page fails before merge); main deploys it to
# https://aman-dhakar-191.github.io/passkey-provider-android/
on:
  push:
    branches: [main]
    paths: [site/**, PRIVACY.md, TERMS.md, docs/store/**, scripts/build_site.py, .github/workflows/pages.yml]
  pull_request:
    paths: [site/**, PRIVACY.md, TERMS.md, docs/store/**, scripts/build_site.py, .github/workflows/pages.yml]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # "last changed" dates come from git history
          persist-credentials: false

      - name: Build site
        run: python3 scripts/build_site.py

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
