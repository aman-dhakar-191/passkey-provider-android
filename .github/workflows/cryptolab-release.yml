name: Crypto Lab release

# Releases the Crypto Lab app (cryptolab/), the experiment app for encrypted phone-to-phone transfer.
# Run manually and pick patch / minor / major: the next version is worked out from the latest cryptolab-vX.Y.Z tag.
#
# Each release is marked as a PRE-RELEASE on purpose: Passkey Vault's own updater follows the repository's
# "latest" release, which GitHub never takes from pre-releases. A Crypto Lab release must never become "latest".
# The demo's updater only looks at demo-v tags, so it ignores these too.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version increase (patch = fixes, minor = new features, major = big changes)"
        type: choice
        options: [patch, minor, major]
        default: minor
      version:
        description: "Exact version instead (optional, e.g. 0.2.0)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            V="${INPUT_VERSION#cryptolab-v}"
            V="${V#v}"
          else
            LATEST=$(git ls-remote --tags --refs origin 'cryptolab-v*' | sed 's#.*refs/tags/cryptolab-v##' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if [ -z "$LATEST" ]; then
              V="0.1.0"
            else
              IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST"
              case "$BUMP" in
                major) V="$((MAJOR + 1)).0.0" ;;
                minor) V="$MAJOR.$((MINOR + 1)).0" ;;
                *) V="$MAJOR.$MINOR.$((PATCH + 1))" ;;
              esac
            fi
            echo "Latest Crypto Lab release ${LATEST:-none}, $BUMP bump -> $V"
          fi
          if ! [[ "$V" =~ ^[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Version must look like 1.2.3 (each part 0-99), got '$V'"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/cryptolab-v$V" > /dev/null; then
            echo "::error::cryptolab-v$V is already released"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. See 'Release signing' in README.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true # signed builds never use a cache an earlier run could have poisoned

      - name: Test and build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew --no-daemon :cryptolab:testDebugUnitTest :cryptolab:assembleRelease -PappVersionName="$VERSION"

      - name: Verify signature and checksum
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APK="crypto-lab-$VERSION.apk"
          cp cryptolab/build/outputs/apk/release/cryptolab-release.apk "$APK"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/apk-signature.txt" \
            || { echo "::error::APK is not signed with APK Signature Scheme v3"; exit 1; }
          sha256sum "$APK" > "$APK.sha256"
          echo "file=$APK" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: cryptolab-v${{ steps.version.outputs.version }}
          name: Crypto Lab ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true # keeps it out of "latest", which Passkey Vault's updater follows
          make_latest: "false"
          generate_release_notes: true
          body: |
            Crypto Lab: an experiment app for sending data to another phone over an encrypted channel
            (Wi-Fi or Bluetooth, paired by QR code or a 6-digit code). It is not Passkey Vault.
            Marked as a pre-release on purpose, so Passkey Vault's updater ignores it.

            Install the APK on two Android 14+ phones; see cryptolab/README.md for how to try it.
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
