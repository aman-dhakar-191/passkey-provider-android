name: Demo release

# Releases the Passkey Demo app (demo/), a test app for trying passkeys the way other apps use them.
# Run manually and pick patch / minor / major: the next version is worked out from the latest demo-vX.Y.Z tag.
# Installed demo apps check this repository's releases for newer demo-v tags and update themselves.
#
# Each release is marked as a PRE-RELEASE on purpose: Passkey Vault's own updater follows the repository's
# "latest" release, which GitHub never takes from pre-releases. A demo release must never become "latest".
#
# The release also carries assetlinks.json: the file the demo's site (RP ID) has to publish at
# https://<site>/.well-known/assetlinks.json so that Passkey Vault lets the demo use the site's passkeys.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version increase (patch = fixes, minor = new features, major = big changes)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Exact version instead (optional, e.g. 2.0.0)"
        required: false
      rp_id:
        description: "Site whose passkeys the demo uses (optional; default is set in demo/build.gradle.kts)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
          RP_ID: ${{ inputs.rp_id }}
        run: |
          if [ -n "$RP_ID" ] && ! [[ "$RP_ID" =~ ^[a-z0-9]([a-z0-9.-]*[a-z0-9])?\.[a-z]{2,}$ ]]; then
            echo "::error::Site must be a lowercase domain name like demo.example.com, got '$RP_ID'"
            exit 1
          fi
          if [ -n "$INPUT_VERSION" ]; then
            V="${INPUT_VERSION#demo-v}"
            V="${V#v}"
          else
            LATEST=$(git ls-remote --tags --refs origin 'demo-v*' | sed 's#.*refs/tags/demo-v##' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
            if [ -z "$LATEST" ]; then
              V="1.0.0"
            else
              IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST"
              case "$BUMP" in
                major) V="$((MAJOR + 1)).0.0" ;;
                minor) V="$MAJOR.$((MINOR + 1)).0" ;;
                *) V="$MAJOR.$MINOR.$((PATCH + 1))" ;;
              esac
            fi
            echo "Latest demo release ${LATEST:-none}, $BUMP bump -> $V"
          fi
          if ! [[ "$V" =~ ^[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error::Version must look like 1.2.3 (each part 0-99), got '$V'"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/demo-v$V" > /dev/null; then
            echo "::error::demo-v$V is already released"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. See 'Release signing' in README.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true # signed builds never use a cache an earlier run could have poisoned

      - name: Test and build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
          RP_ID: ${{ inputs.rp_id }}
        run: |
          ARGS=(-PappVersionName="$VERSION")
          if [ -n "$RP_ID" ]; then ARGS+=(-PdemoRpId="$RP_ID"); fi
          ./gradlew --no-daemon :demo:testDebugUnitTest :demo:assembleRelease "${ARGS[@]}"

      - name: Verify signature, checksum and site file
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APK="passkey-demo-$VERSION.apk"
          cp demo/build/outputs/apk/release/demo-release.apk "$APK"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/apk-signature.txt" \
            || { echo "::error::APK is not signed with APK Signature Scheme v3"; exit 1; }
          sha256sum "$APK" > "$APK.sha256"

          # The certificate fingerprint in the form assetlinks.json uses (uppercase hex pairs, colons).
          HEX=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt" | head -1)
          [[ "$HEX" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Could not read the signing certificate digest"; exit 1; }
          FP=$(echo "$HEX" | sed 's/../&:/g; s/:$//' | tr 'a-f' 'A-F')
          cat > assetlinks.json <<JSON
          [
            {
              "relation": ["delegate_permission/common.get_login_creds"],
              "target": {
                "namespace": "android_app",
                "package_name": "io.github.amandhakar.passkeydemo",
                "sha256_cert_fingerprints": ["$FP"]
              }
            }
          ]
          JSON
          python3 -m json.tool assetlinks.json > /dev/null
          cat assetlinks.json
          echo "file=$APK" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: demo-v${{ steps.version.outputs.version }}
          name: Passkey Demo ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: true # keeps it out of "latest", which Passkey Vault's updater follows
          make_latest: "false"
          generate_release_notes: true
          body: |
            Passkey Demo: a test app for trying passkeys the way other apps use them. It is not Passkey Vault.
            Marked as a pre-release on purpose, so Passkey Vault's updater ignores it.

            `assetlinks.json` is the file the demo's site must publish at `/.well-known/assetlinks.json`.
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
            assetlinks.json
