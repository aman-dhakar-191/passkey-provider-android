<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo login</title>
<style>
  body { font-family: sans-serif; margin: 16px; line-height: 1.4; }
  button, input { font-size: 1.1em; padding: 12px; margin: 6px 0; width: 100%; box-sizing: border-box; }
  pre { white-space: pre-wrap; word-break: break-all; background: #eee; color: #111; padding: 8px; border-radius: 6px; font-size: 0.8em; }
</style>
</head>
<body>
<h2>Demo login page</h2>
<p>A web page shown <b>inside the app</b> (a WebView), like the login pages some apps open instead of a native screen.
Site: <b>__RP_ID__</b></p>
<label>Username <input id="user" value="demo-web"></label>
<button id="create">Create passkey</button>
<button id="get">Sign in with passkey</button>
<pre id="out">Ready.</pre>
<script>
const RP_ID = "__RP_ID__";
const enc = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const out = t => { document.getElementById("out").textContent = t; };
const send = o => {
  if (window.demoBridge) window.demoBridge.postMessage(JSON.stringify(o));
  else out(document.getElementById("out").textContent + "\n\n(No bridge to the app: results cannot be checked by it.)");
};

async function run(kind) {
  try {
    if (!window.PublicKeyCredential) {
      out("This WebView has no WebAuthn (window.PublicKeyCredential is missing).");
      send({ kind: "error", name: "Unsupported", message: "no PublicKeyCredential" });
      return;
    }
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    let cred, response;
    if (kind === "create") {
      const name = document.getElementById("user").value || "demo-web";
      cred = await navigator.credentials.create({ publicKey: {
        rp: { id: RP_ID, name: "Passkey demo" },
        user: { id: new TextEncoder().encode(name).slice(0, 64), name: name, displayName: name },
        challenge: challenge,
        pubKeyCredParams: [{ type: "public-key", alg: -7 }],
        authenticatorSelection: { residentKey: "required", userVerification: "required" },
        attestation: "none",
        timeout: 120000,
      } });
      response = {
        clientDataJSON: enc(cred.response.clientDataJSON),
        attestationObject: enc(cred.response.attestationObject),
        authenticatorData: enc(cred.response.getAuthenticatorData()),
        publicKey: enc(cred.response.getPublicKey()),
      };
    } else {
      cred = await navigator.credentials.get({ publicKey: {
        rpId: RP_ID, challenge: challenge, userVerification: "required", timeout: 120000,
      } });
      response = {
        clientDataJSON: enc(cred.response.clientDataJSON),
        authenticatorData: enc(cred.response.authenticatorData),
        signature: enc(cred.response.signature),
        userHandle: cred.response.userHandle ? enc(cred.response.userHandle) : "",
      };
    }
    out(kind + " returned a credential.\nid: " + cred.id + "\nclientDataJSON: " +
        new TextDecoder().decode(cred.response.clientDataJSON));
    send({ kind: kind, challenge: enc(challenge),
           response: { id: cred.id, rawId: enc(cred.rawId), type: cred.type, response: response } });
  } catch (e) {
    out(kind + " failed: " + e.name + ": " + e.message);
    send({ kind: "error", name: e.name, message: e.message });
  }
}
document.getElementById("create").onclick = () => run("create");
document.getElementById("get").onclick = () => run("get");
</script>
</body>
</html>
